<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <title>Login - Crème & Co</title>
</head>
<body class="pagina-login">
  <header>
    <div class="header-inner">
      <div class="brand-group">
        <span class="brand-logo" aria-hidden="true">C</span>
        <p class="brand">Crème & Co</p>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="checkout.html">Checkout</a></li>
          <li><a href="confirmacion.html">Confirmación</a></li>
          <li><a href="registro.html">Registro</a></li>
          <li><a href="login.html" class="active">Login</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    <section class="form-card">
      <h1>Iniciar sesión</h1>
      <form>
        <div class="form-group">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
      <p class="form-footer-note">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </section>
  </main>
  <footer>
    Pastelería Crème & Co
  </footer>
</body>
</html>
